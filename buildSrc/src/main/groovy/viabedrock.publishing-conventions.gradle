plugins {
    id "base.publishing-conventions"
}

publishing {
    publications {
        mavenJava {
            pom {
                name = "ViaBedrock"
                description = "ViaVersion addon to add support for Minecraft: Bedrock Edition servers"
                url = "https://github.com/RaphiMC/ViaBedrock"
                licenses {
                    license {
                        name = "GPL-3.0 License"
                        url = "https://github.com/RaphiMC/ViaBedrock/blob/main/LICENSE"
                    }
                }
                developers {
                    developer {
                        id = "RK_01"
                    }
                }
                scm {
                    connection = "scm:git:git://github.com/RaphiMC/ViaBedrock.git"
                    developerConnection = "scm:git:ssh://github.com/RaphiMC/ViaBedrock.git"
                    url = "https://github.com/RaphiMC/ViaBedrock.git"
                }
                properties = ["upstream.groupId": "net.raphimc", "upstream.version": project.maven_version]
            }
        }
    }
    repositories {
        // EaseCation private repository (Aliyun Yunxiao Packages); publications always carry a release version.
        // Credentials: yunxiaoMavenUsername / yunxiaoMavenPassword in ~/.gradle/gradle.properties.
        maven {
            name = "yunxiaoMaven"
            url = "https://easecation-cn-hangzhou.devops.aliyuncs.com/packages/api/protocol/maven/14075-release-h64s7e"
            credentials(PasswordCredentials)
        }
    }
}
